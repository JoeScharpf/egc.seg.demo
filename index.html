<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Decoder Design Matters for ECG Delineation</title>
  <link rel="stylesheet" href="css/app.css?v=41">
</head>
<body>
  <header>
    <div class="brand-logos">
      <a href="https://www.cmu.edu/" target="_blank" rel="noopener noreferrer">
        <img src="cmu_logo.png" alt="Carnegie Mellon University">
      </a>
      <a href="https://safeai-lab.github.io/" target="_blank" rel="noopener noreferrer">
        <img src="safe_red.png" alt="SAFE AI Lab">
      </a>
    </div>
    <div class="brand-end">
      <div class="brand-copy">
        <h1>Decoder Design Matters for ECG Delineation</h1>
        <p class="authors">Joseph Scharpf<sup>*</sup>, William Han<sup>*</sup>, Chaojing Duan, Michael A. Rosenberg, Emerson Liu, Ding Zhao</p>
        <p class="lede">P / QRS / T are slow to mark by hand. A neural-net draft you can correct.</p>
      </div>
      <a class="paper-qr" href="https://github.com/JoeScharpf/Will_Joe_ECG" target="_blank" rel="noopener noreferrer">
        <img src="paper_qr.png?v=2" alt="QR code to the paper">
      </a>
    </div>
  </header>

  <main>
    <section id="panel-anno">
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="seg" role="group" aria-label="Draft">
            <button type="button" id="draft-rules">Rules</button>
            <button type="button" id="draft-runet">R-U-Net</button>
          </div>
          <button type="button" id="reset-anno" class="play">Reset</button>
        </div>
        <button type="button" id="new-example" class="play">New example</button>
      </div>

      <div id="anno-missing" class="missing" hidden>
        Missing <code>data/test.js</code>.
      </div>
      <div id="anno-plot-wrap" class="anno-plot-wrap">
        <div id="anno-plot" class="plot anno-plot"></div>
        <button type="button" id="band-delete" class="band-delete" hidden aria-label="Delete this interval">
          <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
            <path d="M3 3l10 10M13 3L3 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <div id="anno-cta" class="anno-cta" hidden>
          <span class="anno-cta-text">Click to annotate</span>
          <div class="seg anno-wave" role="group" aria-label="Wave">
            <button type="button" id="wave-P" class="active">P</button>
            <button type="button" id="wave-QRS">QRS</button>
            <button type="button" id="wave-T">T</button>
          </div>
        </div>
      </div>
    </section>
  </main>

      <img src="arxiv_logo.png" alt="arXiv">

  <script src="vendor/plotly.min.js"></script>
